<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask App 🚀</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 640px;
            width: 100%;
        }

        /* Header */
        .board-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #21262d;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1D9E75;
            flex-shrink: 0;
        }

        .board-header h1 {
            font-size: 15px;
            font-weight: 600;
            color: #e6edf3;
            letter-spacing: -0.01em;
        }

        .board-tag {
            margin-left: auto;
            font-size: 11px;
            font-weight: 500;
            background: #1a3a2e;
            color: #1D9E75;
            border: 1px solid #1D9E75;
            border-radius: 20px;
            padding: 2px 10px;
        }

        /* Messages */
        .messages {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 12px;
            padding: 12px;
            min-height: 260px;
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
            scrollbar-width: thin;
            scrollbar-color: #30363d transparent;
        }

        .messages p {
            background: #1c2128;
            border: 1px solid #21262d;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            line-height: 1.55;
            color: #cdd9e5;
            margin: 0;
        }

        .messages p::before {
            content: "●";
            color: #1D9E75;
            font-size: 8px;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* Compose */
        .compose-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 14px;
        }

        .compose-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #1D9E75;
        }

        input[type="text"]::placeholder {
            color: #484f58;
        }

        input[type="submit"] {
            padding: 10px 20px;
            background: #1D9E75;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            transition: background 0.2s, transform 0.1s;
        }

        input[type="submit"]:hover {
            background: #0F6E56;
        }

        input[type="submit"]:active {
            transform: scale(0.97);
        }

        .compose-hint {
            font-size: 11px;
            color: #484f58;
            margin-top: 8px;
        }

        @media (max-width: 520px) {
            body { padding: 20px 12px; }
            .board-header h1 { font-size: 13px; }
            .compose-row { flex-direction: column; }
            input[type="text"], input[type="submit"] { width: 100%; }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="board-header">
            <span class="live-dot"></span>
            <h1>StackBoard  - Built on the stack that powers real systems </h1>
            <span class="board-tag">Live</span>
        </div>

        <div class="messages">
            {% for message in messages %}
                <p>{{ message[0] }}</p>
            {% endfor %}
        </div>

        <div class="compose-box">
            <form id="messageForm">
                <div class="compose-row">
                    <input type="text" name="new_message" placeholder="Write a message to the board..." required>
                    <input type="submit" value="Post">
                </div>
            </form>
            <p class="compose-hint">Press Enter or click Post to send</p>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $("#messageForm").on("submit", function(event) {
                event.preventDefault();

                let messageInput = $("input[name='new_message']");
                let message = messageInput.val().trim();

                if (message === "") {
                    alert("Message cannot be empty!");
                    return;
                }

                $.ajax({
                    url: "/submit",
                    type: "POST",
                    data: { new_message: message },
                    success: function(response) {
                        if (response && response.message) {
                            $(".messages").append("<p>" + response.message + "</p>");
                            messageInput.val("");
                            var msgs = $(".messages")[0];
                            msgs.scrollTop = msgs.scrollHeight;
                        } else {
                            console.error("Unexpected response format:", response);
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error("AJAX Error:", status, error);
                    }
                });
            });
        });
    </script>
</body>

</html>
